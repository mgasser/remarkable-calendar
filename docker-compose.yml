services:
  planner:
    build: .
    image: remarkable-calendar:latest
    container_name: remarkable-calendar
    restart: unless-stopped
    env_file: .env
    volumes:
      - planner-data:/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  planner-data:
